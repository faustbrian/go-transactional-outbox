operations:
- module: "."
  gate: local-test
  steps:
  - type: go-test
    packages: ["./relay"]
    run: '^TestRunOnce(CancelsPublishWhenLeaseRenewalFails|ReleasesClaimsOnCancellation)$'
    race: true
    count: 1
    timeout: 2m
- module: "."
  gate: fuzz
  steps:
  - type: go-test
    packages:
    - "."
    fuzz: '^FuzzEnvelopeBuilder$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "./postgres"
    fuzz: '^FuzzWriterIdentifiers$'
    budget: 100x
    timeout: 5m
  - type: go-test
    packages:
    - "./relay"
    fuzz: '^FuzzRelayOptions$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "./relay"
    fuzz: '^FuzzPublisherFailures$'
    budget: 100x
    timeout: 2m
- module: "."
  gate: benchmark
  steps:
  - type: go-test
    packages:
    - "./..."
    benchmark: "."
    budget: 100ms
    timeout: 20m
