name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Run the stable release rehearsal
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    uses: faustbrian/go-library-tools/.github/workflows/library-ci.yml@87639677a41610bb9ceceedff836f4aaffb5aca9 # v1.0.1
    with:
      tooling_sha: 87639677a41610bb9ceceedff836f4aaffb5aca9
      release_dry_run: ${{ inputs.release_dry_run || false }}
