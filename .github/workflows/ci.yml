name: CI

on:
  pull_request:
  push:
    # Rulesets do not accept workflow_dispatch checks. This pre-main carrier
    # runs the identical required gates before an ordinary protected-main push.
    branches: [main, chore/identity-passkey-signup-ci]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Run the stable release rehearsal for selected releasable modules
        required: false
        default: false
        type: boolean
      release_module:
        description: Rehearse one module directory; blank selects every releasable module
        required: false
        default: ''
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    uses: faustbrian/go-library-tools/.github/workflows/library-ci.yml@09b43f49385650c44dd4151a12b0877ca6b48a88 # v2.5.1
    with:
      tooling_sha: 09b43f49385650c44dd4151a12b0877ca6b48a88
      source_bootstrap: false
      source_documentation: check
      public_dependencies: true
      release_dry_run: ${{ inputs.release_dry_run || false }}
      release_module: ${{ inputs.release_module || '' }}

  docs-policy:
    name: Documentation policy
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preserve documentation and publication guarantees
        run: ./scripts/check-docs.sh --local

  required:
    name: Required
    if: always()
    needs: [ci, docs-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require shared workflow
        env:
          CI_RESULT: ${{ needs.ci.result }}
          DOCS_RESULT: ${{ needs.docs-policy.result }}
        run: test "${CI_RESULT}" = success && test "${DOCS_RESULT}" = success
